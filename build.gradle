// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    // Define versions in a single place
    ext {
        // Sdk and tools
        minSdkVersion = 19
        targetSdkVersion = 34
        compileSdkVersion = 34

        // App dependencies
        appCompatVersion = '1.7.1'
        constraintLayoutVersion = '2.2.1'
        coroutinesVersion = '1.10.2'
        dataStoreVersion = '1.1.7'
        espressoVersion = '3.7.0'
        fragmentVersion = '1.8.8'
        gradleVersion = '8.13.2'
        hiltAndroidXVersion = '1.0.0'
        hiltVersion = '2.57'
        junitVersion = '4.13.2'
        kotlinVersion = '2.3.20'
        ktxVersion = '1.18.0'
        lifecycleVersion = '2.10.0'
        materialVersion = '1.13.0'
        navigationVersion = '2.9.7'
        roomVersion = '2.8.4'
        testExtJunitVersion = '1.3.0'
        multidex_version = '2.0.1'
        ksp_version = '2.2.0-2.0.2'
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }

    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigationVersion"
        classpath "androidx.room:room-gradle-plugin:$roomVersion"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"
        //classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('clean') {
    delete rootProject.buildDir
}